modules:
  macro:
    - key: mermaid-diagram
      title: Mermaid
      description: Mermaid diagrams as code in the macro body. Rendered in your browser, never sent anywhere.
      resource: main
      # Bodied so humans and AI can put Mermaid source in the macro body (ADF/API-friendly).
      layout: bodied
      categories:
        - visuals
        - development
      unlicensedAccess:
        - unlicensed
        - anonymous
      config:
        resource: config
        title: Diagram settings
        openOnInsert: false
        viewportSize: small
        parameters:
          - identifier: theme
            type: string

resources:
  - key: main
    path: static/view/dist
  - key: config
    path: static/config/dist

app:
  # Run `forge register` once — it replaces this id with yours.
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
  runtime:
    name: nodejs22.x

permissions:
  # No scopes, no external fetch, no backend functions.
  # Mermaid writes style="" on SVG nodes; Forge requires this declaration.
  content:
    styles:
      - 'unsafe-inline'
